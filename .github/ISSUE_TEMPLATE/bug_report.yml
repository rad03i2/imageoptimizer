name: Bug report
description: Report reproducible ImageOptimizer behavior
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please use a generated or non-sensitive sample image and remove personal metadata before attaching files.
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12.4"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11 / Ubuntu / macOS"
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      description: Remove any private local paths if necessary.
      placeholder: "imageoptimizer input.png -o output.webp --format webp"
    validations:
      required: true
  - type: input
    id: formats
    attributes:
      label: Input and output formats
      placeholder: "PNG → WebP"
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error output
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I have not included private images, credentials, or sensitive EXIF data.
          required: true
        - label: I searched existing issues for the same problem.
          required: true
